<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480" role="img" aria-labelledby="t d" font-family="Lato,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Strategic alignment across three enterprise layers</title>
<desc id="d">Institutional intent sits above digital design, which sits above operational reality. Downward arrows show intent being encoded into design and design governing execution. Upward arrows show constraints becoming visible and operational evidence returning. Enterprise architecture spans all three layers as a vertical band.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="40" y="60" width="120" height="380" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text font-size="15" font-weight="600" x="100" y="220" text-anchor="middle" fill="#2C2C2A">Enterprise</text>
<text font-size="15" font-weight="600" x="100" y="240" text-anchor="middle" fill="#2C2C2A">architecture</text>
<text font-size="12.5" font-weight="400" x="100" y="264" text-anchor="middle" fill="#5F5E5A">maintains</text>
<text font-size="12.5" font-weight="400" x="100" y="280" text-anchor="middle" fill="#5F5E5A">coherence</text>
<rect x="180" y="60" width="460" height="80" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text font-size="15" font-weight="600" x="204" y="96" fill="#26215C">Institutional intent</text>
<text font-size="12.5" font-weight="400" x="204" y="118" fill="#534AB7">Strategy, policy, decision rights, funding</text>
<rect x="180" y="210" width="460" height="80" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text font-size="15" font-weight="600" x="204" y="246" fill="#04342C">Digital design</text>
<text font-size="12.5" font-weight="400" x="204" y="268" fill="#0F6E56">Applications, data models, process logic, integrations</text>
<rect x="180" y="360" width="460" height="80" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text font-size="15" font-weight="600" x="204" y="396" fill="#4A1B0C">Operational reality</text>
<text font-size="12.5" font-weight="400" x="204" y="418" fill="#993C1D">Work as performed, assets, services, people</text>
<line x1="280" y1="145" x2="280" y2="203" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<line x1="560" y1="205" x2="560" y2="147" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text font-size="12.5" font-weight="400" x="295" y="179" fill="#5F5E5A">encodes intent</text>
<text font-size="12.5" font-weight="400" x="545" y="179" text-anchor="end" fill="#5F5E5A">reveals constraints</text>
<line x1="280" y1="295" x2="280" y2="353" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<line x1="560" y1="355" x2="560" y2="297" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text font-size="12.5" font-weight="400" x="295" y="329" fill="#5F5E5A">governs execution</text>
<text font-size="12.5" font-weight="400" x="545" y="329" text-anchor="end" fill="#5F5E5A">returns evidence</text>
</svg>
